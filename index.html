<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>Bina Yönetim Paneli</title>
<link rel="manifest" href="manifest.json"/>
<style>
:root{
  --bg:#eef2f7; --card:rgba(255,255,255,.88); --border:rgba(203,213,225,.9); --border2:rgba(226,232,240,.8);
  --text:#1e293b; --muted:#64748b; --input:#f1f5f9; --hover:rgba(148,163,184,.15);
  --shadow:0 1px 2px rgba(15,23,42,.06); --glass:blur(14px);
  --sky:#0ea5e9; --emerald:#10b981; --rose:#f43f5e; --amber:#f59e0b; --violet:#8b5cf6;
}
html.dark{
  --bg:#020617; --card:rgba(15,23,42,.72); --border:rgba(30,41,59,.95); --border2:rgba(30,41,59,.7);
  --text:#e2e8f0; --muted:#94a3b8; --input:rgba(30,41,59,.85); --hover:rgba(148,163,184,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{ -webkit-text-size-adjust:100%; }
body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif; background:var(--bg); color:var(--text); transition:background .3s,color .3s; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
button{ font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
input,select,textarea{ font-family:inherit; font-size:14px; color:var(--text); }
h2{font-size:15px;}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:rgba(120,120,140,.35);border-radius:8px}
.ic{width:16px;height:16px;flex:none} .ic-sm{width:14px;height:14px} .ic-lg{width:22px;height:22px}
.wrap{max-width:1400px;margin:0 auto;padding:0 14px;}
/* header */
header{position:sticky;top:0;z-index:40;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);background:var(--card);border-bottom:1px solid var(--border);}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;}
.logo{display:flex;align-items:center;gap:9px;}
.logob{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#0ea5e9,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 14px rgba(14,165,233,.35);}
.logo b{font-size:14px;display:block;line-height:1.1}
.logo span{font-size:10.5px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none}
.navi{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:0;white-space:nowrap;transition:.15s;}
.navi.on{background:var(--sky);color:#fff;box-shadow:0 4px 12px rgba(14,165,233,.35);}
.navi:not(.on):hover{background:var(--hover);}
.hright{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.period{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:11px;background:var(--input);border:1px solid var(--border);}
.period select{background:transparent;border:0;outline:0;font-weight:600;font-size:13px;color:var(--text);}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:11px;font-size:13px;font-weight:600;border:0;transition:.15s;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.b-sky{background:var(--sky);color:#fff;} .b-sky:hover{background:#0284c7;}
.b-violet{background:var(--violet);color:#fff;} .b-violet:hover{background:#7c3aed;}
.b-ghost{background:var(--input);color:var(--text);border:1px solid var(--border);} .b-ghost:hover{background:var(--hover);}
.b-emerald{background:rgba(16,185,129,.14);color:var(--emerald);} .b-emerald:hover{background:rgba(16,185,129,.25);}
.b-rose{background:rgba(244,63,94,.13);color:var(--rose);} .b-rose:hover{background:rgba(244,63,94,.25);}
.b-xs{padding:6px 9px;font-size:11.5px;border-radius:9px;}
.iconbtn{padding:8px;border-radius:11px;background:var(--input);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;}
/* layout */
main.wrap{padding:18px 14px 60px;}
.stack>*+*{margin-top:16px;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
@media(max-width:1100px){.grid5{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.grid5,.grid3,.grid4{grid-template-columns:1fr 1fr}.kpi-sub{display:none}}
@media(max-width:460px){.grid5,.grid4{grid-template-columns:1fr}}
.card{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);}
.card-p{padding:16px;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.muted{color:var(--muted);} .sm{font-size:12px;} .xs{font-size:11px;}
.tiny{font-size:10px;}
.bold{font-weight:700;} .xbold{font-weight:800;}
/* kpi */
.kpi{padding:15px;position:relative;overflow:hidden;}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.kpi-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.kpi-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.6);}
html.dark .kpi-ic{background:rgba(2,6,23,.4);}
.kpi-val{font-size:22px;font-weight:800;margin-top:8px;word-break:break-word;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.pbar{height:10px;border-radius:99px;background:var(--input);overflow:hidden;margin-top:12px;}
.pbar>div{height:100%;border-radius:99px;transition:width .7s;}
/* quick */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:900px){.qgrid{grid-template-columns:1fr 1fr}}
.qbtn{display:flex;align-items:center;gap:11px;padding:12px;border-radius:15px;background:transparent;border:1px solid var(--border);text-align:left;transition:.15s;color:var(--text);}
.qbtn:hover{border-color:rgba(14,165,233,.5);transform:translateY(-2px);box-shadow:0 8px 20px rgba(14,165,233,.12);}
.qic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;}
/* charts */
.chart{width:100%;height:auto;display:block;}
.legend{max-height:150px;overflow-y:auto;margin-top:6px;}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12px;padding:2.5px 0;}
.dot{width:10px;height:10px;border-radius:99px;flex:none;}
.donutbox{display:flex;flex-direction:column;align-items:center;}
.pbar-stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--input);}
.asset-row{display:flex;align-items:center;gap:10px;font-size:13px;}
/* tables */
.tblw{overflow-x:auto;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border2);vertical-align:middle;}
.tbl tbody tr:hover{background:var(--hover);}
.tbl tfoot td{font-weight:700;border-bottom:0;background:var(--hover);}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;}
.p-green{background:rgba(16,185,129,.15);color:var(--emerald);}
.p-red{background:rgba(244,63,94,.15);color:var(--rose);}
.p-amber{background:rgba(245,158,11,.16);color:var(--amber);}
.p-blue{background:rgba(14,165,233,.15);color:var(--sky);}
.p-violet{background:rgba(139,92,246,.15);color:var(--violet);}
.p-gray{background:var(--hover);color:var(--muted);}
.cellact{display:flex;gap:4px;justify-content:flex-end;}
.mini{padding:6px;border-radius:9px;background:transparent;border:0;color:var(--muted);display:flex;}
.mini:hover{background:var(--hover);color:var(--sky);}
.mini.del:hover{color:var(--rose);}
/* apartments */
.aptgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:1100px){.aptgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.aptgrid{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.aptgrid{grid-template-columns:1fr}}
.apt{padding:14px;transition:.15s;cursor:pointer;}
.apt:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(14,165,233,.13);border-color:rgba(14,165,233,.45);}
.apt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.apt-id{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;}
.a-green{background:rgba(16,185,129,.15);color:var(--emerald);}
.a-red{background:rgba(244,63,94,.15);color:var(--rose);}
.a-amber{background:rgba(245,158,11,.16);color:var(--amber);}
.a-gray{background:var(--hover);color:var(--muted);}
.apt-who{min-width:0;flex:1;}
.apt-who b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.apt-who span{font-size:11px;color:var(--muted);}
.apt-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px;text-align:center;}
.apt-nums>div{background:var(--input);border-radius:10px;padding:6px 2px;}
.apt-nums span{font-size:9px;font-weight:700;color:var(--muted);display:block;}
.apt-nums b{font-size:12px;}
.apt-btns{display:flex;gap:5px;margin-top:10px;}
.apt-btns .btn{flex:1;padding:6px 4px;font-size:11px;}
/* filterbar */
.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.fgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--input);border:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.seg button{padding:6px 11px;border-radius:9px;font-size:12px;font-weight:600;border:0;background:transparent;color:var(--muted);white-space:nowrap;}
.seg button.on{background:var(--card);color:var(--sky);box-shadow:var(--shadow);}
.search{position:relative;}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);}
.input{width:100%;padding:9px 12px;border-radius:11px;background:var(--input);border:1px solid var(--border);outline:0;transition:.15s;}
.input:focus{box-shadow:0 0 0 3px rgba(14,165,233,.3);border-color:var(--sky);}
select.input{width:auto;cursor:pointer;}
.search .input{padding-left:32px;}
.w64{width:220px;max-width:100%;}
/* modal */
.mroot{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:14px;}
.mroot.open{display:flex;}
.mback{position:absolute;inset:0;background:rgba(2,6,23,.62);backdrop-filter:blur(4px);}
.mbox{position:relative;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .25s ease both;}
.mbox.wide{max-width:680px;}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--card);backdrop-filter:var(--glass);border-radius:18px 18px 0 0;}
.mhead b{font-size:14.5px;display:flex;align-items:center;gap:8px;}
.mbody{padding:16px;}
.frm{display:grid;gap:11px;}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
@media(max-width:480px){.frm .two{grid-template-columns:1fr}}
label.f{display:block;}
label.f span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px;}
/* toast */
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:13px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;animation:pop .25s ease both;max-width:92vw;}
/* misc */
.list-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--input);border:1px solid var(--border2);font-size:13px;}
.scroll-y{max-height:250px;overflow-y:auto;}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:700px){.big3{grid-template-columns:1fr}}
.statbox{padding:15px;border-radius:15px;font-size:13px;}
.statbox .v{font-size:22px;font-weight:800;margin-top:4px;}
.fade{animation:pop .3s ease both;}
.sumrow{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-radius:12px;background:var(--input);font-size:13px;}
.hr-space{margin-top:14px;}
</style>
</head>

function calcAll(){
  var mk=getMK(), aidatDefined=!!S.settings.aidatAylari[mk];
  var mIncome=S.incomes.filter(function(i){return monthKeyOf(i.tarih)===mk;});
  var mExpense=S.expenses.filter(function(e){return monthKeyOf(e.tarih)===mk;});
  var sum=function(arr,f){return arr.reduce(function(t,x){return t+x[f];},0);};
  var tIncome=sum(mIncome,"tutar"), tExpense=sum(mExpense,"tutar");
  var totIncome=sum(S.incomes,"tutar"), totExpense=sum(S.expenses,"tutar");
  var net=S.settings.devir+totIncome-totExpense;
  var paidMap={};
  mIncome.filter(function(i){return i.daireId;}).forEach(function(i){paidMap[i.daireId]=(paidMap[i.daireId]||0)+i.tutar;});
  var rows=S.apartments.map(function(a){
    var expected=aidatDefined?(a.ozelAidat||1500):0;
    var paid=paidMap[a.id]||0;
    return Object.assign({},a,{expected:expected,paid:paid,debt:Math.max(0,expected-paid),
      status:!aidatDefined?"—":(paid>=expected?"Ödedi":(paid>0?"Kısmen":"Borçlu"))});
  });
  var totalDue=rows.reduce(function(t,r){return t+r.expected;},0);
  var totalPaid=rows.reduce(function(t,r){return t+Math.min(r.paid,r.expected);},0);
  return {mk:mk,aidatDefined:aidatDefined,mIncome:mIncome,mExpense:mExpense,tIncome:tIncome,tExpense:tExpense,
    totIncome:totIncome,totExpense:totExpense,net:net,rows:rows,totalDue:totalDue,totalPaid:totalPaid,
    rate:totalDue>0?Math.round(totalPaid/totalDue*100):null,
    borclu:rows.filter(function(r){return r.status==="Borçlu";})};
}
function flowData(){
  var arr=[];
  for(var k=5;k>=0;k--){
    var d=new Date(S.settings.yil,S.settings.ay-k,1);
    var key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    arr.push({ay:AYLAR[d.getMonth()].slice(0,3)+" "+String(d.getFullYear()).slice(2),
      Gelir:S.incomes.filter(function(i){return monthKeyOf(i.tarih)===key;}).reduce(function(t,i){return t+i.tutar;},0),
      Gider:S.expenses.filter(function(e){return monthKeyOf(e.tarih)===key;}).reduce(function(t,e){return t+e.tutar;},0)});
  }
  return arr;
}

/* ================= ÇİZİMLER (SVG) ================= */
function chartFlow(flow){
  var W=660,H=280,L=52,R=12,T=14,B=32;
  var max=1; flow.forEach(function(f){max=Math.max(max,f.Gelir,f.Gider);});
  var nice=Math.max(500,Math.ceil(max/4/500)*500);
  var top=nice*4, xw=(W-L-R)/flow.length, bw=Math.min(15,xw/3.2);
  var y0=H-B, g="",lbl="",line=[];
  flow.forEach(function(f,i){
    var x=L+i*xw+xw/2;
    var hg=(f.Gelir/top)*(H-T-B), hd=(f.Gider/top)*(H-T-B);
    g+='<rect x="'+(x-bw-2).toFixed(1)+'" y="'+(y0-hg).toFixed(1)+'" width="'+bw+'" height="'+hg.toFixed(1)+'" rx="4" fill="#10b981"/>';
    g+='<rect x="'+(x+2).toFixed(1)+'" y="'+(y0-hd).toFixed(1)+'" width="'+bw+'" height="'+hd.toFixed(1)+'" rx="4" fill="#f43f5e"/>';
    lbl+='<text x="'+x.toFixed(1)+'" y="'+(H-10)+'" font-size="10" text-anchor="middle" fill="#94a3b8">'+f.ay+'</text>';
    line.push([x,y0-hg]);
  });
  var grid="";
  for(var i=0;i<=4;i++){
    var y=y0-(i/4)*(H-T-B);
    grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="rgba(148,163,184,.25)" stroke-dasharray="3 3"/>';
    grid+='<text x="'+(L-6)+'" y="'+(y+3).toFixed(1)+'" font-size="10" text-anchor="end" fill="#94a3b8">'+(i*nice>=1000?(i*nice/1000)+"k":i*nice)+'</text>';
  }
  var lp=line.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart">'+grid+g+
    '<path d="'+lp+'" fill="none" stroke="#059669" stroke-width="2"/>'+
    line.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#059669"/>';}).join("")+lbl+'</svg>';
}
function ringSVG(data,colors,size){
  var r=56,C=2*Math.PI*r,total=data.reduce(function(t,d){return t+d.value;},0);
  var segs="";
  if(total<=0){ segs='<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="rgba(148,163,184,.3)" stroke-width="22"/>'; }
  else{
    var acc=0;
    data.forEach(function(d,i){
      var len=d.value/total*C;
      segs+='<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="'+colors[i%colors.length]+'" stroke-width="22" stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-acc).toFixed(1)+'" transform="rotate(-90 80 80)"/>';
      acc+=len;
    });
  }
  return '<svg viewBox="0 0 160 160" style="width:'+(size||170)+'px;height:'+(size||170)+'px">'+segs+'</svg>';
}
function areaSVG(flow){
  var W=660,H=280,L=52,R=12,T=14,B=32;
  var max=1; flow.forEach(function(f){max=Math.max(max,f.Gelir,f.Gider);});
  var nice=Math.max(500,Math.ceil(max/4/500)*500), top=nice*4, xw=(W-L-R)/(flow.length-1||1), y0=H-B;
  function pts(key){return flow.map(function(f,i){return [L+i*xw, y0-(f[key]/top)*(H-T-B)];});}
  function path(p){return p.map(function(q,i){return (i?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ");}
  function area(p){return path(p)+"L"+(p[p.length-1][0]).toFixed(1)+","+y0+"L"+p[0][0].toFixed(1)+","+y0+"Z";}
  var g1=pts("Gelir"),g2=pts("Gider");
  var grid="";
  for(var i=0;i<=4;i++){
    var y=y0-(i/4)*(H-T-B);
    grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="rgba(148,163,184,.25)" stroke-dasharray="3 3"/>';
    grid+='<text x="'+(L-6)+'" y="'+(y+3).toFixed(1)+'" font-size="10" text-anchor="end" fill="#94a3b8">'+(i*nice>=1000?(i*nice/1000)+"k":i*nice)+'</text>';
  }
  var lbl=flow.map(function(f,i){return '<text x="'+(L+i*xw).toFixed(1)+'" y="'+(H-10)+'" font-size="10" text-anchor="middle" fill="#94a3b8">'+f.ay+'</text>';}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart">'+grid+
    '<path d="'+area(g1)+'" fill="#10b981" opacity="0.22"/><path d="'+path(g1)+'" fill="none" stroke="#10b981" stroke-width="2.5"/>'+
    '<path d="'+area(g2)+'" fill="#f43f5e" opacity="0.18"/><path d="'+path(g2)+'" fill="none" stroke="#f43f5e" stroke-width="2.5"/>'+lbl+'</svg>';
}

function vDash(c){
  var netPos=c.net>=0;
  var rateColor=c.rate==null?"#94a3b8":c.rate>=80?"#10b981":c.rate>=50?"#f59e0b":"#ef4444";
  var donutMap={}; c.mExpense.forEach(function(e){donutMap[e.kategori]=(donutMap[e.kategori]||0)+e.tutar;});
  var donut=Object.keys(donutMap).map(function(k){return {name:k,value:donutMap[k]};}).sort(function(a,b){return b.value-a.value;});
  var donutTot=donut.reduce(function(t,d){return t+d.value;},0);

/* ---------- GELİRLER ---------- */
function incomeList(){
  var mk=getMK();
  return S.incomes.filter(function(i){
    if(UI.iq){var a=aptById(i.daireId);var s=((a?("Daire "+a.no+" "+a.ad):"")+" "+i.tur+" "+i.makbuzNo).toLowerCase(); if(s.indexOf(UI.iq.toLowerCase())<0) return false;}

function downloadCSV(name,rows){
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(";");}).join("\n");
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=name; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

    var inT=inR.reduce(function(t,i){return t+i.tutar;},0),exT=exR.reduce(function(t,e){return t+e.tutar;},0);
    printHTML("Dönem Raporu",
      '<div class="row"><div><h1>DÖNEM RAPORU</h1><div class="muted">'+(UI.from||"başlangıç")+" — "+(UI.to||"bugün")+' tarih aralığı</div></div><div class="muted">'+new Date().toLocaleDateString("tr-TR")+'</div></div>'+
      '<h2>GELİRLER</h2><table><tr><th>Tarih</th><th>Daire</th><th>Tür</th><th class="r">Tutar (₺)</th></tr>'+
      (inR.map(function(i){return '<tr><td>'+i.tarih+'</td><td>'+aptName(i.daireId)+'</td><td>'+esc(i.tur)+'</td><td class="r">'+TL2(i.tutar)+'</td></tr>';}).join("")||'<tr><td colspan="4">Kayıt yok</td></tr>')+
      '<tr class="tot"><td colspan="3">TOPLAM GELİR</td><td class="r">'+TL2(inT)+'</td></tr></table>'+
      '<h2>GİDERLER</h2><table><tr><th>Tarih</th><th>Kategori</th><th>Firma</th><th class="r">Tutar (₺)</th></tr>'+
      (exR.map(function(e){return '<tr><td>'+e.tarih+'</td><td>'+esc(e.kategori)+'</td><td>'+esc(e.firma)+'</td><td class="r">'+TL2(e.tutar)+'</td></tr>';}).join("")||'<tr><td colspan="4">Kayıt yok</td></tr>')+
      '<tr class="tot"><td colspan="3">TOPLAM GİDER</td><td class="r">'+TL2(exT)+'</td></tr></table>'+
      '<h2>ÖZET</h2><table><tr><td>Net Fark (Gelir - Gider)</td><td class="r">'+TL2(inT-exT)+'</td></tr>'+
      '<tr class="tot"><td>GENEL NET KASA (tüm dönem)</td><td class="r">'+TL2(calcAll().net)+'</td></tr></table>');
  },

  csvInc:function(){
    var list=incomeList();
    downloadCSV("gelirler.csv",[["Tarih","Daire","Tür","Tutar","Ödeme Tipi","Makbuz No"]].concat(list.map(function(i){var a=aptById(i.daireId);return [i.tarih,a?("Daire "+a.no+(a.ad?" - "+a.ad:"")):"Genel",i.tur,i.tutar,i.odemeTipi,i.makbuzNo];})));
    showToast("CSV indirildi.");
  },
  csvExp:function(){
    var list=expenseList();
    downloadCSV("giderler.csv",[["Tarih","Kategori","Firma","Fatura No","Açıklama","Tutar"]].concat(list.map(function(e){return [e.tarih,e.kategori,e.firma,e.faturaNo,e.aciklama||"",e.tutar];})));
    showToast("CSV indirildi.");
  }
};
